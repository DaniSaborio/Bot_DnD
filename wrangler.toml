name = "dnd-dm-bot"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "dnd-dm"
database_id = "REEMPLAZAR_CON_EL_ID_DE_TU_D1"

[vars]
# Modelo de Gemini. "gemini-3.8-flash" narra mejor; "gemini-3.5-flash-lite" es más rápido y tiene más cuota gratuita.
GEMINI_MODEL = "gemini-3.8-flash"
# Cuánto "piensa" el modelo antes de responder: "low", "medium" o "high". Más alto = más lento.
GEMINI_THINKING = "low"

# Secretos (no van aquí): wrangler secret put DISCORD_PUBLIC_KEY / DISCORD_APP_ID / GEMINI_API_KEY
